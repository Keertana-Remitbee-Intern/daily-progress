<!--
Day: 09
Date: 18-Aug-2026

Topics Covered:
Control Flow & Functions - if/else, switch, loops (for, while, for...of), function
declarations vs expressions, and scope.

Practice:
Build a simple calculator and a number guessing game
in vanilla JavaScript.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Calculator & Number Guessing Game</h1>
        <p>JavaScript Practice</p>
    </header>

    <main>
        <!-- Calculator -->
        <section class="card">

            <h2>Simple Calculator</h2>
            <p class="description">
                Basic Arithmetic Operations
            </p>

            <div class="calculator">
                <input
                    type="number"
                    id="num1"
                    placeholder="First Number"
                >
                
                <select id="operator">
                    <option value="+">Addition</option>
                    <option value="-">Subtraction</option>
                    <option value="*">Multiplication</option>
                    <option value="/">Division</option>
                </select>

                <input
                    type="number"
                    id="num2"
                    placeholder="Second Number"
                >

                <button onclick="calculate()">
                    Calculate
                </button>

                <p id="result" class="result"></p>
            </div>
        </section>

        <!-- Number Guessing Game-->
        <section class="card">

            <h2>Number Guessing Game</h2>
            <p class="description">
                Guess the secret number between 1 and 100
            </p>

            <div class="guessing-game">
                <input
                    type="number"
                    id="guess"
                    placeholder="Enter your guess"
                >

                <button onclick="checkGuess()">
                    Guess
                </button>

                <p id="message" class="message"></p>

                <button
                    id="playAgain"
                    onclick="playAgain()"
                    style="display: none;"
                >
                    Play Again
                </button>
            </div>

        </section>    
    </main>    

    <footer>
        <p>&copy; 2026 Keertana T S</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
